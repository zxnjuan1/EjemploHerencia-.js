<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herencia en JavaScript</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 30px;
      color: #1f2937;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      color: #0f172a;
    }

    .card {
      background: #eef6ff;
      border-left: 5px solid #2563eb;
      padding: 15px 18px;
      margin: 15px 0;
      border-radius: 8px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
    }

    button:hover {
      background: #1d4ed8;
    }

    pre {
      background: #111827;
      color: #d1fae5;
      padding: 15px;
      border-radius: 10px;
      overflow: auto;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Herencia en JavaScript</h1>

    <div class="card">
      <p>La herencia permite reutilizar propiedades y métodos de una clase base en clases hijas.</p>
      <button onclick="mostrarEjemplo()">Ejecutar ejemplo</button>
    </div>

    <pre id="resultado"></pre>
  </div>

  <script>
    class Vehiculo {
      constructor(marca, modelo, color) {
        this.marca = marca;
        this.modelo = modelo;
        this.color = color;
      }

      encender() {
        return `${this.marca} ${this.modelo}: motor encendido.`;
      }

      acelerar() {
        return `${this.marca} ${this.modelo}: acelerando...`;
      }

      mostrarInfo() {
        return `Vehículo: ${this.marca} ${this.modelo} - Color: ${this.color}`;
      }
    }

    class Carro extends Vehiculo {
      constructor(marca, modelo, color, puertas) {
        super(marca, modelo, color);
        this.puertas = puertas;
      }

      abrirPuertas() {
        return `Abriendo ${this.puertas} puertas del ${this.marca} ${this.modelo}.`;
      }

      mostrarInfo() {
        return `${super.mostrarInfo()} | Tipo: Carro | Puertas: ${this.puertas}`;
      }
    }

    class Moto extends Vehiculo {
      constructor(marca, modelo, color, cilindrada) {
        super(marca, modelo, color);
        this.cilindrada = cilindrada;
      }

      hacerCaballito() {
        return `${this.marca} ${this.modelo}: ¡haciendo caballito!`;
      }

      mostrarInfo() {
        return `${super.mostrarInfo()} | Tipo: Moto | Cilindrada: ${this.cilindrada}cc`;
      }
    }

    function mostrarEjemplo() {
      const miCarro = new Carro('Toyota', 'Corolla', 'Rojo', 4);
      const miMoto = new Moto('Honda', 'CBR', 'Negra', 600);

      const salida = [
        '==== CARRO ====',
        miCarro.encender(),
        miCarro.acelerar(),
        miCarro.abrirPuertas(),
        miCarro.mostrarInfo(),
        '',
        '==== MOTO ====',
        miMoto.encender(),
        miMoto.acelerar(),
        miMoto.hacerCaballito(),
        miMoto.mostrarInfo()
      ].join('\n');

      document.getElementById('resultado').textContent = salida;
    }
  </script>
</body>
</html>
